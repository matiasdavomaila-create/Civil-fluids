name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear proyecto Flutter
        run: flutter create --org com.civil.fluids --project-name civil_fluids temp_app

      - name: Escribir código de la app
        run: |
          echo "import 'dart:math';" > temp_app/lib/main.dart
          echo "import 'package:flutter/material.dart';" >> temp_app/lib/main.dart
          echo "void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text('Calculadora de Fluidos')))));" >> temp_app/lib/main.dart

      - name: Compilar APK
        run: |
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
